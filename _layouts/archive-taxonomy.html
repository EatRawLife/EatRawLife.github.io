<!-- 현재 미사용: jekyll-archives 플러그인이 태그/카테고리별 개별 페이지를 생성할 때 쓰는 레이아웃인데,
     Gemfile과 _config.yml에서 jekyll-archives가 주석 처리되어 비활성 상태라 이 레이아웃을 참조하는 페이지가 없음 -->

<div id="main" role="main">
  {% include sidebar.html %}

  <div class="archive">
    <h1 class="page__title">{{ page.title }}</h1>
    {% include base_path %}
    {% for post in page.posts %}
      {% include archive-single.html %}
    {% endfor %}
  </div>
</div>
